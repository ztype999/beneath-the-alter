name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build and validate the website
        env:
          SITE_URL: https://beneaththealter.eu.org
          # Until beneaththealter.eu.org resolves, social scrapers must be able to
          # fetch the Open Graph image from a host that actually works. Canonical
          # and sitemap already point at the new domain and activate on DNS.
          SOCIAL_IMAGE_BASE: https://ztype999.github.io/beneath-the-alter
        run: bun build/build-site.ts .
      - name: Package public website files
        run: |
          mkdir -p _site
          cp -- *.html *.css *.js robots.txt sitemap.xml _site/
          cp -r assets admin _site/
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  # Mirrors the published site to Cloudflare's edge. GitHub Pages above stays the
  # primary publish target; this job only runs a deploy once the CLOUDFLARE_API_TOKEN
  # repository secret exists, so CI stays green either way.
  edge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Build the website
        env:
          SITE_URL: https://beneaththealter.eu.org
          # Matches the build job: social image served from a host that resolves.
          SOCIAL_IMAGE_BASE: https://ztype999.github.io/beneath-the-alter
        run: bun build/build-site.ts .
      - name: Package files for the edge Worker
        run: |
          mkdir -p edge/dist
          cp -- *.html *.css *.js robots.txt sitemap.xml edge/dist/
          cp -r assets admin edge/dist/
      - name: Check for Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Cloudflare edge
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: edge
          command: deploy --config wrangler.jsonc
      - name: Report that the edge deploy is not enabled yet
        if: steps.cf.outputs.enabled != 'true'
        run: |
          echo "::notice::Cloudflare edge deploy skipped - add CLOUDFLARE_API_TOKEN as a repository secret to publish https://www.beneaththealter.workers.dev on every push."
