name = "bta-analytics"
main = "worker.js"
compatibility_date = "2026-01-01"

[observability]
enabled = true

# Daily purge of analytics rows older than RETENTION_DAYS (see worker.js),
# which is what makes the privacy notice's retention promise true.
[triggers]
crons = ["17 3 * * *"]

[vars]
GITHUB_ALLOWED_LOGIN = "ztype999"
SITE_ORIGIN = "https://ztype999.github.io"
# Extra origins allowed to READ dashboard responses (worker.js readableOrigins).
# Deliberately does not affect /api/ingest, which stays locked to SITE_ORIGIN,
# so page views from these origins are still not counted.
DASHBOARD_ORIGINS = "https://www.beneaththealter.workers.dev,https://beneaththealter.eu.org"
# Where the dashboard lives after login. This is a GitHub Pages project site,
# so the path includes /beneath-the-alter/.
DASHBOARD_URL = "https://ztype999.github.io/beneath-the-alter/admin/analytics.html"
# Optional. Leave commented to derive the callback from the Worker's own URL
# (https://<your-worker>.workers.dev/auth/callback). If you set a custom domain
# or route, uncomment and set it explicitly.
# GITHUB_CALLBACK_URL = "https://bta-analytics.YOUR-WORKER-DOMAIN.workers.dev/auth/callback"

[[d1_databases]]
binding = "DB"
database_name = "bta-analytics"
database_id = "37d70f13-677c-40a9-a0c3-861b25be1543"
